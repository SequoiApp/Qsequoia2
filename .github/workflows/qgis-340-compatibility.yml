name: QGIS 3.40 compatibility

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python-39-syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Compile plugin with Python 3.9
        run: python -m compileall -q qsequoia2