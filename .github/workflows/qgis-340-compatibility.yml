name: QGIS 3.40 compatibility

on:
  pull_request:
  push:
    branches:
      - main
      - DEV

jobs:
  python-39-syntax:
    # Keep a runner with available Python 3.9 builds.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Compile plugin with Python 3.9
        run: python -m compileall -q qsequoia2
