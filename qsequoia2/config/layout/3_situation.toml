filename = "situation"
alias = "Situation"

[canvas]
zoom_on = "v.seq.forest.poly"

[canvas.layers]
sequoia = [
    "v.com.topo.point",
    "v.com.topo.line",
    "v.access.entry.point",
    "v.secu.prsf.point",
    "v.curves.line",
    "v.road.line",
    "v.seq.forest.point",
    "v.seq.forest.line",
    "v.seq.forest.poly",
]
wmts = [
    "wmts.scan.regional",
    "wmts.scan1000",
]
tms = [
    "tms.plan_ign.standard",
    "tms.plan_ign.classique",
]


[[layout.maps]]
id = "map1"
main_map = true
scale = 25000
layers = [
    "v.com.topo.point",
    "v.com.topo.line",
    "v.curves.line",
    "v.access.entry.point",
    "v.access.prsf.point",
    "v.seq.forest.poly",
    "tms.plan_ign.standard",
]

[[layout.maps]]
id = "map2"
main_map = false
scale = 800000
layers = [
    "v.seq.forest.point",
    "tms.plan_ign.classique",
]

[[layout.legends]]
id = "legend1"
map = "map1"
layers = ["v.seq.forest.poly"]
