assemblage:
  alias : "Assemblage cadastral"
  canvas:
    zoom_on: v.seq.parca.poly
    readonly: [v.seq.parca.poly]
    layers:
      sequoia: &assemblage_seq
        - v.com.topo.line
        - v.com.topo.point
        - v.infra.point
        - v.infra.line
        - v.infra.poly
        - v.toponyme.point
        - v.road.line
        - v.roadway.line
        - v.roadway.poly
        - v.hydro.poly
        - v.hydro.line
        - v.vege.poly
        - v.curves.line
        # Order is important here, we want parca to be at the back so vectoriel layers are visible on top of it
        - v.seq.owner.line
        - v.seq.parca.poly
      wmts: &assemblage_wmts
        - wmts_scan25
        - wmts_scan25_grey
        - wmts_scan100
        - wmts_pci

  layout:
    scale: 7500
    layers: *assemblage_seq
    legends:
      - id: legend1
        layers: *assemblage_seq

situation:
  alias: "Carte de situation"

  canvas:
    zoom_on: "v.seq.forest.poly"
    layers:
      sequoia: &situation_seq
        - v.seq.forest.point
        - v.seq.forest.poly
        - v.com.topo.line
        - v.curves.line
        - v.secu.prsf.point
        - v.infra.point
        - v.infra.line
        - v.infra.poly
        - v.road.line
        - v.roadway.line
        - v.roadway.poly
        - v.toponyme.point
        - v.hydro.point
        - v.hydro.line
        - v.hydro.poly
        - v.vege.point
        - v.vege.line
        - v.vege.poly
      tms: &situation_tms
        - tms.plan_ign.standard
        - tms.plan_ign.classique
      wmts: &situation_wmts
        - wmts_scan25
        - wmts_scan25_grey
        - wmts_scan100

  layout:
    scale: 25000
    maps:
      - id: map1
        follow_canvas: true
        scale: 25000
        layers: *situation_seq
      - id: map2
        follow_canvas: false
        scale: 800000
        layers:
          - v.seq.forest.point
          - tms.plan_ign.classique
    legends:
      - id: legend1
        map: map1
        layers: *situation_seq

