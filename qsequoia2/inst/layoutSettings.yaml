geologie:
  alias : "Cartographie géologique et stationnelle"
  canvas:
    scale: 15000
    zoom_on: SEQ_PARCA_poly
    readonly: [SEQ_PARCA_poly]

    groups:
      - name : SEQUOIA
        type : vector
        layers : &geol_w_seq ['SEQ_OWNER_line', 'SEQ_PF_line']

      - name : VECTOR
        type : vector
        layers : &geol_w_vect ['CURVES_line','SOL_BDCHARM50_poly','SOL_CARHAB_poly']
      - name : WMTS
        type : wmts
        layers : &geol_w_wmts ['wmts_scan25_grey']
    themes:
      - name: geologie
        show: [*geol_w_seq, *geol_w_vect, *geol_w_wmts]

  layout:
    theme: 'geologie'
    legends:
      - name: legend1
        layers: ['SEQ_PARCA_poly']
      - name: legend2
        layers: ['SOL_BDCHARM50_poly', 'SOL_CARHAB_poly']