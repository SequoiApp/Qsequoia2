assemblage:
  alias : "Plan d'assemblage cadastral"
  canvas:
    scale: 7500
    zoom_on: SEQ_PARCA_poly
    readonly: [SEQ_PARCA_poly]
    groups:
      - name: VECTEUR
        type: vector
        layers: &assemblage_w_vect 
          - COMS_TOPO_line
          - CURVES_line
          - COMS_TOPO_point
          - INFRA_point
          - INFRA_line
          - INFRA_poly
          - TOPONYME_point
          - ROAD_TOPO_line
          - ROAD_TOPO_poly
          - ROAD_GRAPH_line
          - ROAD_GRAPH_poly
          - HYDRO_poly
          - HYDRO_line
          - VEGE_poly
          - CAD_PARCELLE_poly
      - name: SEQUOIA
        type: vector
        layers: &assemblage_w_seq
          - SEQ_OWNER_line
          - SEQ_PARCA_poly

      - name: WMTS
        type: wmts
        layers: &assemblage_w_wmts
          - wmts_scan25_grey
          - wmts_scan100
          - wmts_scan1000
          - wmts_pci
          - wmts_irc
          - wmts_rgb
    themes:
      - name: assemblage
        show: [*assemblage_w_vect, *assemblage_w_seq]
      - name: assemblage+WMTS
        show: [*assemblage_w_vect, *assemblage_w_seq, *assemblage_w_wmts]

  
  layout:
    theme: 'assemblage'
    legends:
      - name: legend1
        layers: [*assemblage_w_seq, *assemblage_w_wmts]
      - name: 'legend2'
        layers: *assemblage_w_vect

situation:
  alias : "Cartographie de situation"
  canvas:
    scale: 25000
    zoom_on: 'SEQ_PARCA_poly'
    readonly: ['SEQ_PARCA_poly']
    groups: 
      - name: VECTEUR
        type: vector
        layers: &situation_w_vect
          - COMS_TOPO_line
          - CURVES_line
          - PRSF_point
          - INFRA_poly
          - ROAD_TOPO_poly
          - ROAD_TOPO_line
          - TOPONYME_point
          - HYDRO_poly
          - HYDRO_line
          - VEGE_poly

      - name: SEQUOIA
        type: vector
        layers: &situation_w_seq
          - SEQ_PF_point
          - SEQ_PF_line
          - SEQ_PF_poly
          - SEQ_PROP_point

      - name: WMTS
        type: wmts
        layers: &situation_w_wmts
          - 'wmts_scan25'
          - 'wmts_scan1000'

    themes:
      - name: situation1/25000
        show: [*situation_w_vect, *situation_w_seq]
      - name: situation1/25000+WMTS
        show: [*situation_w_seq, *situation_w_wmts]
      - name: situation1/100000
        show: ['SEQ_PROP_point', 'wmts_scan1000']

  layout:
    theme: 'situation1/25000'
    legends:
      - name: legend1
        layers: [*situation_w_seq,'wmts_scan1000']
      - name: legend2
        layers: *situation_w_vect

peuplements:
  alias : "Cartographie des peuplements forestiers"
  canvas:
    scale: 7500
    zoom_on: 'parca_polygon_lgd_peuplements'
    readonly: [parca_polygon_lgd_peuplements, parca_polygon_occup, ua_polygon_plt]
    groups:
      - name: LEGEND
        type: vector
        layers: ['parca_polygon_lgd_peuplements']
      - name: VECTEUR
        type: vector
        layers: &peuplements_w_vect ['com_line', 'com_point', 'infra_point_peuplements', 'infra_line', 'topo_line', 'infra_polygon', 'lieudit_point', 'road_line', 'road_polygon', 'route_line', 'route_polygon']
      - name: SEQUOIA
        type: vector
        layers: &peuplements_w_seq ['prop_line', 'pf_line', 'pf_polygon', 'sspf_polygon', 'sspf_polygon_plt', 'parca_polygon_occup', 'ua_polygon', 'ua_polygon_plt', 'ua_polygon_ame']
      - name: WMTS
        type: wmts
        layers: &peuplements_w_wmts ['wmts_scan25_grey', 'wmts_scan100', 'wmts_scan1000', 'wmts_pci', 'wmts_irc', 'wmts_rgb']

    themes:
      - name: peuplements
        show: [*peuplements_w_vect, *peuplements_w_seq]
      - name: peuplements+WMTS
        show: [*peuplements_w_vect, *peuplements_w_seq, *peuplements_w_wmts]


  layout:
    theme: 'peuplements'
    legends:
      - name: legend1
        layers: ['SEQ_SSPF_poly']
      - name: legend2
        layers: ['sspf_polygon_plt']

